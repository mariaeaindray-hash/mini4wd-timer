<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ミニ四駆 3レーン計測 / Mini 4WD Timer</title><style>
:root{color-scheme:dark;font-family:system-ui,'Noto Sans',sans-serif}body{margin:0;background:#101820;color:#f5f7fa}header{padding:14px 16px;background:#1c2b37}h1{font-size:19px;margin:0}small{color:#bac8d2}.wrap{max-width:1100px;margin:auto;padding:12px}.preview{position:relative;background:#26343d;border-radius:10px;overflow:hidden}video{display:block;width:100%;height:auto;max-height:52vh;object-fit:contain}canvas{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}.stat{padding:10px;border-radius:10px;background:#20303d;border-top:4px solid var(--accent)}.stat h2{font-size:14px;margin:0 0 8px}.stat div{font-size:13px;margin:3px 0}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}button{background:#2c86bc;border:0;border-radius:8px;color:white;padding:12px;font-size:14px;cursor:pointer}button:disabled{opacity:.5}button.secondary{background:#47596a}#status{padding:8px 0;color:#c6d5e0}.hint{font-size:13px;color:#bccad3}table{width:100%;border-collapse:collapse;font-size:13px}td,th{border-bottom:1px solid #384957;text-align:left;padding:7px}@media(max-width:550px){.stats{grid-template-columns:1fr}video{max-height:45vh}}</style></head>
<body><header><h1>ミニ四駆 3レーン周回タイム計測</h1><small>Mini 4WD Three-Lane Lap Timer</small></header><main class="wrap"><div id="status">カメラ未起動 / Camera not started</div><div class="preview"><video id="video" autoplay muted playsinline></video><canvas id="overlay"></canvas></div><div class="controls"><button id="startCam">カメラ起動 / Start camera</button><button id="startMeasure" disabled>計測開始 / Start measuring</button><button id="reset" class="secondary">リセット / Reset</button><button id="export" class="secondary">CSV保存 / Export CSV</button></div><p class="hint">背面カメラをコース上に固定してください。開始後5秒間は動かさないでください。 / Fix rear camera above the track. Keep the view clear for 5 seconds after starting measurement.</p><section id="stats" class="stats"></section><h2>計測履歴 / Lap history</h2><table><thead><tr><th>レーン / Lane</th><th>周回 / Lap</th><th>通過日時 / Crossing date/time</th><th>秒 / Seconds</th></tr></thead><tbody id="history"></tbody></table></main><script>
'use strict';
const video=document.getElementById('video'),overlay=document.getElementById('overlay'),ctx=overlay.getContext('2d'),statusEl=document.getElementById('status'),statsEl=document.getElementById('stats'),historyEl=document.getElementById('history');
const colors=['#facc15','#4ade80','#38bdf8'];let stream=null,active=false,calibrateUntil=0,background=null,lastSample=0,records=[];
const work=document.createElement('canvas');work.width=320;work.height=240;const wctx=work.getContext('2d',{willReadFrequently:true});
const lanes=Array.from({length:3},()=>({count:0,times:[],last:null,inside:false,empty:0}));
const zones=[[.05,.33],[.36,.64],[.67,.95]];const minInterval=1000,threshold=30,minChangedRatio=.085,emptyRequired=3;
function dateStr(d){return d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0')+' '+[d.getHours(),d.getMinutes(),d.getSeconds()].map(v=>String(v).padStart(2,'0')).join(':')+'.'+String(d.getMilliseconds()).padStart(3,'0')}
function render(){statsEl.innerHTML=lanes.map((l,i)=>`<article class="stat" style="--accent:${colors[i]}"><h2>レーン ${i+1} / Lane ${i+1}</h2><div>周回数 / Laps: <b>${l.count}</b></div><div>最新 / Last: ${l.times.length?l.times.at(-1).toFixed(3):'—'} s</div><div>最速 / Best: ${l.times.length?Math.min(...l.times).toFixed(3):'—'} s</div><div>平均 / Average: ${l.times.length?(l.times.reduce((a,b)=>a+b,0)/l.times.length).toFixed(3):'—'} s</div></article>`).join('');historyEl.innerHTML=records.slice(-30).reverse().map(r=>`<tr><td>${r.lane}</td><td>${r.lap}</td><td>${r.date}</td><td>${r.seconds.toFixed(3)}</td></tr>`).join('')}
function reset(){active=false;background=null;records=[];lanes.forEach(l=>{l.count=0;l.times=[];l.last=null;l.inside=false;l.empty=0});statusEl.textContent='リセットしました / Reset';render()}
function draw(){if(!video.videoWidth)return;overlay.width=video.videoWidth;overlay.height=video.videoHeight;const W=overlay.width,H=overlay.height;ctx.clearRect(0,0,W,H);const font=Math.max(14,Math.round(W*.024));ctx.font=`bold ${font}px sans-serif`;zones.forEach(([a,b],i)=>{const x=a*W,y=.4*H,w=(b-a)*W,h=.2*H;ctx.strokeStyle=colors[i];ctx.lineWidth=3;ctx.strokeRect(x,y,w,h);ctx.fillStyle=colors[i];ctx.fillText(`Lane ${i+1}`,x,y-8)});}
function processFrame(t){if(!stream)return;draw();if(t-lastSample<65){requestAnimationFrame(processFrame);return}lastSample=t;if(video.readyState<2){requestAnimationFrame(processFrame);return}wctx.drawImage(video,0,0,320,240);const pixels=wctx.getImageData(0,0,320,240).data;const gray=new Uint8Array(320*240);for(let p=0,k=0;p<pixels.length;p+=4,k++)gray[k]=(pixels[p]*.299+pixels[p+1]*.587+pixels[p+2]*.114)|0;
if(active){if(!background){background=new Float32Array(gray);calibrateUntil=t+5000}if(t<calibrateUntil){for(let k=0;k<gray.length;k++)background[k]=background[k]*.9+gray[k]*.1;statusEl.textContent='背景学習中 / Calibrating… '+Math.ceil((calibrateUntil-t)/1000)+'s'}else{statusEl.textContent='計測中 / Measuring · '+dateStr(new Date());zones.forEach(([a,b],i)=>{let changed=0,total=0;const left=Math.floor(a*320),right=Math.floor(b*320),top=96,bottom=144;for(let y=top;y<bottom;y+=2)for(let x=left;x<right;x+=2){const k=y*320+x;total++;if(Math.abs(gray[k]-background[k])>threshold)changed++}const detected=changed/total>minChangedRatio;const l=lanes[i];if(detected&&!l.inside){l.inside=true;l.empty=0;const now=performance.now();if(l.last===null){l.last=now}else if(now-l.last>=minInterval){const seconds=(now-l.last)/1000;l.last=now;l.count++;l.times.push(seconds);records.push({lane:i+1,lap:l.count,date:dateStr(new Date()),seconds});render()}}else if(!detected){l.empty++;if(l.empty>=emptyRequired)l.inside=false}else{l.empty=0}});for(let k=0;k<gray.length;k++)background[k]=background[k]*.997+gray[k]*.003}}requestAnimationFrame(processFrame)}
document.getElementById('startCam').onclick=async()=>{try{if(stream)stream.getTracks().forEach(tr=>tr.stop());stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});video.srcObject=stream;await video.play();document.getElementById('startMeasure').disabled=false;statusEl.textContent='カメラ起動成功 / Camera ready';requestAnimationFrame(processFrame)}catch(e){statusEl.textContent='カメラエラー / Camera error: '+e.message}};
document.getElementById('startMeasure').onclick=()=>{reset();active=true;statusEl.textContent='背景学習開始 / Starting calibration'};
document.getElementById('reset').onclick=reset;
document.getElementById('export').onclick=()=>{const lines=[['レーン / Lane','周回 / Lap','通過日時 / Crossing date and time','周回タイム(秒) / Lap time (s)'],...records.map(r=>[r.lane,r.lap,r.date,r.seconds.toFixed(3)])];const csv='\ufeff'+lines.map(r=>r.join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='mini4wd_3lane_'+new Date().toISOString().slice(0,10)+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)};
render();
</script></body></html>
